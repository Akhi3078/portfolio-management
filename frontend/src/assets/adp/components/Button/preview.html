<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Button — Harbor Design System</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>html, body { margin: 0; } body { background: var(--background); }</style>
</head>
<body>
<div class="adp-standard-root" style="padding: 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center;">
<button class="adp-standard-btn adp-standard-btn-primary">Save changes</button>
<button class="adp-standard-btn adp-standard-btn-secondary">Duplicate</button>
<button class="adp-standard-btn adp-standard-btn-outline">Export</button>
<button class="adp-standard-btn adp-standard-btn-ghost">Cancel</button>
<button class="adp-standard-btn adp-standard-btn-danger">Delete vessel</button>
<button class="adp-standard-btn adp-standard-btn-primary" disabled>Saving…</button>
</div>
</body>
</html>
