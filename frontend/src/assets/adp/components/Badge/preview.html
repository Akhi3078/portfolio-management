<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Badge — Harbor Design System</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>html, body { margin: 0; } body { background: var(--background); }</style>
</head>
<body>
<div class="adp-standard-root" style="padding: 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center;">
<span class="adp-standard-badge adp-standard-badge-success">Delivered</span>
<span class="adp-standard-badge adp-standard-badge-warning">Pending customs</span>
<span class="adp-standard-badge adp-standard-badge-danger">Overdue</span>
<span class="adp-standard-badge adp-standard-badge-info">Note added</span>
</div>
</body>
</html>
